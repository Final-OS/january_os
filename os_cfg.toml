# ==============================================================================
# january_os Configuration
# ==============================================================================

[arch]
# 目标架构:
# - "x86_64": 目前唯一支持的目标
# - "aarch64": 规划中，当前不可用
# 该值会影响内核/引导编译目标与链接脚本选择。
target = "x86_64"

# ==============================================================================
# 内存管理配置
# ==============================================================================
[memory]
# 页大小 (字节):
# 需要与架构最小页粒度一致；x86_64 通常为 4KB。
page_size = 4096
# Buddy System 最大 order:
# 最大块大小 = 2^max_order * page_size。
# 例如 11 => 2^11 * 4KB = 8MB。
buddy_max_order = 11

[memory.zone]
# Zone 边界定义 (字节):
# - ZONE_DMA: 0 - dma_limit (传统 ISA DMA, 24-bit 地址)
# - ZONE_DMA32: dma_limit - dma32_limit (32-bit PCI DMA)
# - 剩余高端内存为 ZONE_NORMAL
dma_limit = 16777216        # 16 MB
dma32_limit = 4294967296    # 4 GB

[memory.pcp]
# PCP (Per-CPU Page Cache) 配置:
# - high_watermark: 单个 CPU 缓存上限页数
# - batch_size: 批量回收/补充的页数
# 适当增大可降低锁竞争，但会增加内存占用波动。
high_watermark = 64
batch_size = 16

# ==============================================================================
# 内核配置
# ==============================================================================
[kernel]
# 内核加载物理地址:
# 与链接脚本保持一致；通常为 1MB 以避开低端保留区域。
phys_base = "0x0100000"
# 直接映射区偏移:
# 线性映射 = phys + direct_map_offset，用于快速物理内存访问。
direct_map_offset = "0xFFFF880000000000"
# vmalloc 虚拟区间（闭区间）:
# direct-map 会按需扩展，但上限不超过 vmalloc_start，避免地址空间重叠。
vmalloc_start = "0xFFFFC90000000000"
vmalloc_end = "0xFFFFE8FFFFFFFFFF"
# 内核堆初始大小 (字节):
# 仅为启动时的最小堆，后续可按需扩展。
heap_init_size = 16777216   # 16 MB
# 内核栈大小 (字节/每CPU):
# 栈过小易溢出，过大则浪费内存。
stack_size = 32768          # 32 KB
# initrd 启动命令（通过 boot cmdline 传给内核）:
# 内核会解析 `initrd=<path>`，默认启动该用户态程序。
initrd_command = "ksh"

[kernel.layout]
# 内核虚拟地址布局策略:
# - linux_full: Linux 风格窗口布局（direct-map/vmalloc/vmemmap/modules/fixmap）
profile = "linux_full"
# 虚拟地址模式:
# - la57_prefer: 优先 5-level，当前若无法启用则自动回退到 4-level
va_mode = "la57_prefer"
# LA57 回退策略:
# - 4level: 运行时自动回退到 4-level 并继续启动
la57_fallback = "4level"
# KASLR 策略（当前仅支持 off）
kaslr = "off"
# Linux 风格窗口参数（闭区间）：
# - vmemmap: struct page 线性映射窗口
# - modules: 模块/内核扩展窗口
# - fixmap: 固定映射窗口
vmemmap_start = "0xFFFFEA0000000000"
vmemmap_end = "0xFFFFEFFFFFFFFFFF"
modules_start = "0xFFFFFFFFA0000000"
modules_end = "0xFFFFFFFFFEFFFFFF"
fixmap_start = "0xFFFFFFFFFF000000"
fixmap_end = "0xFFFFFFFFFFFFF000"
# 是否要求“完整物理内存可管理”：
# true  = 若可用物理内存超出 direct-map 可覆盖窗口则启动失败
# false = 允许降级并截断到 direct-map 窗口上限
manage_full_phys = true
# 是否在启动阶段回收低地址 identity-map（0..3GiB）：
# true  = 启用回收（需确保无低地址直接访问依赖）
# false = 保持兼容映射，优先稳定性
teardown_identity_map = true

# ==============================================================================
# 用户空间布局配置
# ==============================================================================
[user]
# 用户空间起始地址（NULL 保护区之后）
space_start = "0x0000000000400000"
# 用户空间结束地址（不含）
space_end = "0x0000800000000000"
# 用户栈顶虚拟地址
stack_top = "0x00007FFFFFFFF000"
# 用户栈最大可扩展大小（字节）
stack_size = 8388608        # 8 MB
# exec 初始映射的用户栈页数（后续可按缺页扩展到 stack_size）
stack_init_pages = 8
# mmap 默认起始基址（向上搜索空洞）
mmap_base = "0x00007FFFF0000000"

# ==============================================================================
# 系统限制
# ==============================================================================
[limits]
# 最大 CPU 数量:
# 用于限制内核启用的 CPU 上限，避免异常拓扑导致资源耗尽。
max_cpus = 64
# APIC ID 索引槽位上限（影响 per-APIC 数据结构容量）
max_apic_ids = 256

# ==============================================================================
# 内存访问架构 (UMA / NUMA)
# ==============================================================================
[memory_model]
# 内存模型: "auto" / "uma" / "numa"
#
# UMA (Uniform Memory Access):
#   - 所有 CPU 访问所有内存的延迟相同
#   - 适用于单路 CPU 或小型系统
#   - 简单高效，无需节点感知调度
#
# NUMA (Non-Uniform Memory Access):
#   - 不同 CPU 访问不同内存区域延迟不同
#   - 适用于多路服务器
#   - 需要从 ACPI SRAT 表检测拓扑
#   - 内核会尽量在本地节点分配内存
#
# 自动模式:
#   - 系统只报告一个内存节点（node0），内核就把它当成 UMA（或“伪 UMA”） 来用。
#   - 如果报告多个节点，内核就按 NUMA 初始化 node/zone，并据此做分配和调度。
type = "auto"

[memory_model.numa]
max_nodes = 8           # 最大节点数
# local_distance = 10   # 本地访问距离
# remote_distance = 20  # 远程访问距离

# ==============================================================================
# IOMMU 配置
# ==============================================================================
[iommu]
# IOMMU 模式: "off" / "on" / "auto"
# "off"  = 禁用 IOMMU，使用 bounce buffer (SWIOTLB)
# "on"   = 强制启用 IOMMU
# "auto" = 自动检测 (Intel VT-d / AMD-Vi)
mode = "auto"
# 地址翻译模式: "passthrough" / "translate"
# "passthrough" = 1:1 映射，低开销，适合性能优先
# "translate"   = 完整地址翻译，更安全
translation = "passthrough"
# SWIOTLB bounce buffer 大小 (字节):
# 仅当 IOMMU 禁用时使用，过小会导致 DMA 失败。
swiotlb_size = 67108864     # 64 MB

# ==============================================================================
# 调试配置
# ==============================================================================
[debug]
# 详细模式:
# true = 打印完整的启动/关机日志
# false = 只打印必要的关键信息，避免冗余输出
verbose = true
# 串口输出:
# 建议在早期引导阶段保持开启，便于排查崩溃。
serial = true
# 详细内存调试:
# 输出页分配/释放、伙伴系统合并等细节日志。
mm_debug = true
# 页分配追踪:
# 记录每次分配的调用栈/标记，开销较大。
page_alloc_trace = true

# ==============================================================================
# 构建配置
# ==============================================================================
[build]
# 优化级别 (0-3, s, z):
# - 3: 最大优化
# - s/z: 优先减小体积
opt_level = 3
# 是否包含调试符号:
# true 便于调试/回溯，但会增大体积。
debug_symbols = true
# LTO: "off" / "thin" / "fat"
# "thin" 在体积与编译时间之间平衡。
lto = "off"
