# ==============================================================================
# january_os Configuration
# ==============================================================================

[arch]
# 目标架构:
# - "x86_64": 目前唯一支持的目标
# - "aarch64": 规划中，当前不可用
# 该值会影响内核/引导编译目标与链接脚本选择。
target = "x86_64"

# ==============================================================================
# QEMU 虚拟机配置
# ==============================================================================
[qemu]
# 内存大小 (支持 M/G 后缀):
# 例如 "256M", "1G"。过小会导致内核堆/页分配不足。
memory = "1G"
# CPU 核心数:
# 影响 SMP 启动的 CPU 数量，超过 limits.max_cpus 的部分会被忽略。
smp = 4
# CPU 型号:
# 留空使用 QEMU 默认；"host" 需要 KVM/硬件支持。
# 常见候选: host, qemu64, Skylake-Client, EPYC。
cpu = ""
# KVM 加速: "auto" / "on" / "off"
# "auto" 会在检测到 /dev/kvm 时启用。
kvm = "auto"
# 机器类型: "i440fx" / "q35"
# q35 支持 PCIe 和 IOMMU，i440fx 是传统 PCI
machine = "q35"
# 模拟 IOMMU: true / false
# 启用后 QEMU 会添加 Intel VT-d IOMMU 设备
# 需要 machine = "q35"
iommu = true

# ==============================================================================
# 内存管理配置
# ==============================================================================
[memory]
# 页大小 (字节):
# 需要与架构最小页粒度一致；x86_64 通常为 4KB。
page_size = 4096
# Buddy System 最大 order:
# 最大块大小 = 2^max_order * page_size。
# 例如 11 => 2^11 * 4KB = 8MB。
buddy_max_order = 11

[memory.zone]
# Zone 边界定义 (字节):
# - ZONE_DMA: 0 - dma_limit (传统 ISA DMA, 24-bit 地址)
# - ZONE_DMA32: dma_limit - dma32_limit (32-bit PCI DMA)
# - 剩余高端内存为 ZONE_NORMAL
dma_limit = 16777216        # 16 MB
dma32_limit = 4294967296    # 4 GB

[memory.pcp]
# PCP (Per-CPU Page Cache) 配置:
# - high_watermark: 单个 CPU 缓存上限页数
# - batch_size: 批量回收/补充的页数
# 适当增大可降低锁竞争，但会增加内存占用波动。
high_watermark = 64
batch_size = 16

# ==============================================================================
# 内核配置
# ==============================================================================
[kernel]
# 内核加载物理地址:
# 与链接脚本保持一致；通常为 1MB 以避开低端保留区域。
phys_base = "0x0100000"
# 直接映射区偏移:
# 线性映射 = phys + direct_map_offset，用于快速物理内存访问。
direct_map_offset = "0xFFFF880000000000"
# 内核堆初始大小 (字节):
# 仅为启动时的最小堆，后续可按需扩展。
heap_init_size = 16777216   # 16 MB
# 内核栈大小 (字节/每CPU):
# 栈过小易溢出，过大则浪费内存。
stack_size = 32768          # 32 KB

# ==============================================================================
# 系统限制
# ==============================================================================
[limits]
# 最大 CPU 数量:
# 用于限制内核启用的 CPU 上限，避免异常拓扑导致资源耗尽。
max_cpus = 64

# ==============================================================================
# 内存访问架构 (UMA / NUMA)
# ==============================================================================
[memory_model]
# 内存模型: "auto" / "uma" / "numa"
#
# UMA (Uniform Memory Access):
#   - 所有 CPU 访问所有内存的延迟相同
#   - 适用于单路 CPU 或小型系统
#   - 简单高效，无需节点感知调度
#
# NUMA (Non-Uniform Memory Access):
#   - 不同 CPU 访问不同内存区域延迟不同
#   - 适用于多路服务器
#   - 需要从 ACPI SRAT 表检测拓扑
#   - 内核会尽量在本地节点分配内存
#
# 自动模式:
#   - 系统只报告一个内存节点（node0），内核就把它当成 UMA（或“伪 UMA”） 来用。
#   - 如果报告多个节点，内核就按 NUMA 初始化 node/zone，并据此做分配和调度。
type = "auto"

[memory_model.numa]
max_nodes = 8           # 最大节点数
# local_distance = 10   # 本地访问距离
# remote_distance = 20  # 远程访问距离

# ==============================================================================
# IOMMU 配置
# ==============================================================================
[iommu]
# IOMMU 模式: "off" / "on" / "auto"
# "off"  = 禁用 IOMMU，使用 bounce buffer (SWIOTLB)
# "on"   = 强制启用 IOMMU
# "auto" = 自动检测 (Intel VT-d / AMD-Vi)
mode = "auto"
# 地址翻译模式: "passthrough" / "translate"
# "passthrough" = 1:1 映射，低开销，适合性能优先
# "translate"   = 完整地址翻译，更安全
translation = "passthrough"
# SWIOTLB bounce buffer 大小 (字节):
# 仅当 IOMMU 禁用时使用，过小会导致 DMA 失败。
swiotlb_size = 67108864     # 64 MB

# ==============================================================================
# 调试配置
# ==============================================================================
[debug]
# 串口输出:
# 建议在早期引导阶段保持开启，便于排查崩溃。
serial = true
# 详细内存调试:
# 输出页分配/释放、伙伴系统合并等细节日志。
mm_debug = true
# 页分配追踪:
# 记录每次分配的调用栈/标记，开销较大。
page_alloc_trace = true

# ==============================================================================
# 构建配置
# ==============================================================================
[build]
# 优化级别 (0-3, s, z):
# - 3: 最大优化
# - s/z: 优先减小体积
opt_level = 3
# 是否包含调试符号:
# true 便于调试/回溯，但会增大体积。
debug_symbols = true
# LTO: "off" / "thin" / "fat"
# "thin" 在体积与编译时间之间平衡。
lto = "off"
